name: SMP CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & Import Check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff --quiet

      - name: Ruff lint (errors only)
        run: ruff check . --select E,F --ignore E501,F401,E402,E701,E741 --exclude venv,__pycache__

  verify:
    name: Verify SMP Components
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsqlcipher-dev \
            nmap \
            perl \
            git \
            build-essential \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info \
            nodejs \
            npm \
            golang

      - name: Create venv & install Python deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip --quiet
          # pysqlcipher3 needs explicit compiler flags on Ubuntu 24.04
          CFLAGS="-I/usr/include/sqlcipher" LDFLAGS="-lsqlcipher" \
            pip install pysqlcipher3 --quiet
          grep -v "^pysqlcipher3" requirements.txt | \
            pip install -r /dev/stdin --quiet

      - name: Smoke test — core imports
        run: |
          source venv/bin/activate
          python -c "
          import tools.db_manager
          import tools.config_manager
          import tools.encryption_manager
          import tools.risk_scorer
          import intelligence.brain
          import intelligence.cisa
          import intelligence.epss
          import intelligence.greynoise
          import intelligence.nvd
          import scanners.ppmap
          import scanners.wscat_scanner
          import scanners.race_the_web
          import scanners.idor_scanner
          print('All core imports OK')
          "
        env:
          SMP_CI: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Smoke test — API server import
        run: |
          source venv/bin/activate
          python -c "import api.server; print('API server import OK')"
        env:
          SMP_CI: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Run verification suite
        run: |
          source venv/bin/activate
          python tools/verify_smp.py -v
        env:
          SMP_CI: "1"
          PYTHONPATH: ${{ github.workspace }}

      - name: Run unit test suite (pytest)
        run: |
          source venv/bin/activate
          pip install pytest --quiet
          pytest tests/ -v
        env:
          SMP_CI: "1"
          PYTHONPATH: ${{ github.workspace }}

