name: SMP CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Verify SMP Components
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsqlcipher-dev \
            libsqlcipher0 \
            nmap \
            perl \
            git \
            build-essential \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Create virtual environment & install Python deps
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip --quiet
          # pysqlcipher3 requires explicit compiler flags on Ubuntu 22.04 + modern OpenSSL
          CFLAGS="-I/usr/include/sqlcipher" LDFLAGS="-lsqlcipher" \
            pip install pysqlcipher3 --quiet
          # Install remaining dependencies (pysqlcipher3 already satisfied above)
          grep -v "^pysqlcipher3" requirements.txt | pip install -r /dev/stdin --quiet

      - name: Run verification suite
        run: |
          source venv/bin/activate
          python tools/verify_smp.py -v
        env:
          SMP_CI: "1"
          PYTHONPATH: ${{ github.workspace }}
