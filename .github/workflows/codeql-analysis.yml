name: "CodeQL Security Scan"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 1"   # Weekly — Monday 02:00 UTC

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlcipher-dev libsqlcipher0t64 build-essential

      - name: Install Python dependencies for CodeQL
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip --quiet
          CFLAGS="-I/usr/include/sqlcipher" LDFLAGS="-lsqlcipher" \
            pip install pysqlcipher3 --quiet
          grep -v "^pysqlcipher3" requirements.txt | \
            pip install -r /dev/stdin --quiet

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
